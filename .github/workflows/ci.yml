name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict

  build-and-test:
    name: Build & Test
    runs-on: macos-15
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve iOS Simulator
        id: sim
        run: |
          xcrun simctl list > /dev/null
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | grep -v "unavailable" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "destination=platform=iOS Simulator,id=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator id=$UDID"

      - name: Create Config.xcconfig
        env:
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: echo "GEOAPIFY_API_KEY = $GEOAPIFY_API_KEY" > Config.xcconfig

      - name: Test with coverage
        run: |
          set -o pipefail
          rm -rf build/coverage.xcresult
          xcodebuild test \
            -project blueprint.xcodeproj \
            -scheme blueprint \
            -destination "${{ steps.sim.outputs.destination }}" \
            -enableCodeCoverage YES \
            -resultBundlePath build/coverage.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Check coverage threshold
        run: chmod +x scripts/check-coverage.sh && ./scripts/check-coverage.sh build/coverage.xcresult 70
