name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict

  build-and-test:
    name: Build & Test
    runs-on: macos-15
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Create Secrets.swift
        env:
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: |
          cat > blueprint/Secrets.swift << EOF
          //
          //  Secrets.swift
          //  blueprint
          //
          //  Created by Luiz Mello on 22/07/26.
          //
          enum Secrets {
              static let geoapifyAPIKey = "${GEOAPIFY_API_KEY}"
          }
          EOF

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project blueprint.xcodeproj \
            -scheme blueprint \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project blueprint.xcodeproj \
            -scheme blueprint \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
