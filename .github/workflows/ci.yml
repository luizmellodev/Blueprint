name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict

  build-and-test:
    name: Build & Test
    runs-on: macos-15
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create Config.xcconfig
        env:
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: echo "GEOAPIFY_API_KEY = $GEOAPIFY_API_KEY" > Config.xcconfig

      - name: Test with coverage
        run: |
          set -o pipefail
          rm -rf build/coverage.xcresult
          xcodebuild test \
            -project blueprint.xcodeproj \
            -scheme blueprint \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -enableCodeCoverage YES \
            -resultBundlePath build/coverage.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Check coverage threshold
        run: chmod +x scripts/check-coverage.sh && ./scripts/check-coverage.sh build/coverage.xcresult 70
