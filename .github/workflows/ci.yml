name: CI

on:
  push:
    branches: [main]
    paths:
      - 'blueprint/**'
      - 'Packages/**'
      - 'blueprint.xcodeproj/**'
      - 'blueprintTests/**'
      - 'blueprintUITests/**'
      - '.swiftlint.yml'
      - 'scripts/check-coverage.sh'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'blueprint/**'
      - 'Packages/**'
      - 'blueprint.xcodeproj/**'
      - 'blueprintTests/**'
      - 'blueprintUITests/**'
      - '.swiftlint.yml'
      - 'scripts/check-coverage.sh'
      - '.github/workflows/ci.yml'

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict

  build-and-test:
    name: Build & Test
    runs-on: macos-15
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve iOS Simulator
        id: sim
        run: |
          xcrun simctl list > /dev/null
          DESTINATIONS=$(xcodebuild -project blueprint.xcodeproj -scheme blueprint -showdestinations 2>/dev/null \
            | grep "platform:iOS Simulator" \
            | grep "arch:arm64")
          pick() {
            echo "$DESTINATIONS" | grep "name:$1 }" | head -1
          }
          LINE=$(pick "iPhone 16")
          if [ -z "$LINE" ]; then
            LINE=$(pick "iPhone 17")
          fi
          if [ -z "$LINE" ]; then
            LINE=$(echo "$DESTINATIONS" | grep -E "name:iPhone [0-9]+ }" | head -1)
          fi
          if [ -z "$LINE" ]; then
            echo "No iPhone simulator destination found"
            xcodebuild -project blueprint.xcodeproj -scheme blueprint -showdestinations
            exit 1
          fi
          UDID=$(echo "$LINE" | grep -oE 'id:[0-9A-F-]{36}' | head -1 | cut -d: -f2)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "destination=platform=iOS Simulator,id=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using $LINE"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Create Config.xcconfig
        env:
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: echo "GEOAPIFY_API_KEY = $GEOAPIFY_API_KEY" > Config.xcconfig

      - name: Test with coverage
        run: |
          set -o pipefail
          rm -rf build/coverage.xcresult
          xcodebuild test \
            -project blueprint.xcodeproj \
            -scheme blueprint \
            -destination "${{ steps.sim.outputs.destination }}" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -enableCodeCoverage YES \
            -resultBundlePath build/coverage.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Check coverage threshold
        run: chmod +x scripts/check-coverage.sh && ./scripts/check-coverage.sh build/coverage.xcresult 70
