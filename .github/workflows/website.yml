name: Website

on:
  push:
    branches: [main]
    paths:
      - 'Website/**'
      - 'Documentation/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'Website/**'
      - 'Documentation/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Website build
        uses: actions/cache@v4
        with:
          path: |
            Website/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-website-${{ hashFiles('Website/Package.resolved', 'Website/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-website-

      - name: Build site
        run: |
          cd Website
          swift build -c release --product Website
          .build/arm64-apple-macosx/release/Website

      - name: Verify output
        run: test -f Website/deploy/index.html

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: Website/deploy
          retention-days: 7

  deploy:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: website
          path: Website/deploy

      - name: Verify deploy output
        run: test -f Website/deploy/index.html

      - name: Prepare Vercel config
        run: |
          printf '{\n  "cleanUrls": true,\n  "trailingSlash": true\n}\n' > Website/deploy/vercel.json

      - name: Link Vercel project for CLI
        run: |
          mkdir -p Website/deploy/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "${{ secrets.VERCEL_ORG_ID }}" \
            "${{ secrets.VERCEL_PROJECT_ID }}" > Website/deploy/.vercel/project.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        working-directory: Website/deploy
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
